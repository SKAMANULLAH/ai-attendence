# Nginx Configuration for snap-ai.online on AWS EC2
# Place in: /etc/nginx/sites-available/snap-ai.online
# Enable with: sudo ln -s /etc/nginx/sites-available/snap-ai.online /etc/nginx/sites-enabled/
# Then run: sudo certbot --nginx -d snap-ai.online -d www.snap-ai.online -d api.snap-ai.online

# 1. FastAPI Backend API (api.snap-ai.online -> Port 8000)
server {
    server_name api.snap-ai.online;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large classroom photos (up to 50MB)
        client_max_body_size 50M;

        # Timeout settings for AI processing
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# 2. React Frontend (snap-ai.online and www.snap-ai.online)
server {
    server_name snap-ai.online www.snap-ai.online;
    root /var/www/snap-ai/frontend/dist;
    index index.html;

    # Gzip compression for speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Single Page Application (SPA) routing
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
