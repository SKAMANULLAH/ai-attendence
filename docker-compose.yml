version: '3.8'

services:
  # FastAPI Biometrics Backend
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: snap-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DOMAIN=snap-ai.online

  # React Frontend (Optional containerized build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snap-ai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
